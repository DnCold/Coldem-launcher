name: Release launcher

on:
  push:
    tags:
      - "v*"

concurrency:
  group: launcher-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-windows:
    name: Build, sign, and publish Windows launcher
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      COLDEM_DISCORD_APPLICATION_ID: "1537134570078732304"

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Require the signing key
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is not configured in repository Actions secrets"
          }

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify the release tag
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package version $version"
          }

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the butler sidecar
        run: pnpm sidecar:fetch

      - name: Verify Discord Social SDK runtime
        shell: pwsh
        run: |
          foreach ($file in @(
            "src-tauri/vendor/discord/discord_partner_sdk.dll",
            "src-tauri/vendor/discord/discord_krisp.dll",
            "src-tauri/vendor/discord/discord_partner_sdk.lib"
          )) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing bundled Discord SDK file: $file" }
          }

      - name: Build and publish the signed installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Coldem v__VERSION__
          releaseBody: Download the setup executable below to install or update Coldem.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
          retryAttempts: 2
          args: --config src-tauri/tauri.release.conf.json --bundles nsis
