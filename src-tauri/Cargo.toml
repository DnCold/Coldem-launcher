[package]
name = "coldem-launcher"
version = "0.3.0"
description = "A focused desktop launcher for DanCold games"
authors = ["DanCold"]
edition = "2021"

[lib]
name = "coldem_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = "0.3"
getrandom = "0.3"
minisign-verify = "0.2"
open = "5"
reqwest = { version = "0.13", features = ["stream"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "sync", "time"] }
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
